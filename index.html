<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead8c0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EC Pasabuy"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>EC Pasabuy PH</title><style>:root{--bg:#faf4ec;--card:#fff;--ink:#2b2118;--mute:#7b6a5b;--pri:#654023;--pri2:#f1e3d0;--navy:#1b2234;--tan:#d5b79b;--ok:#12805c;--okbg:#e3f6ee;--warn:#9a5a00;--warnbg:#fff1dc;--bad:#c62828;--badbg:#fde7e7;--line:#eadccb;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#ead8c0;color:var(--navy);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--tan)}
header img{width:42px;height:42px;border-radius:50%;flex:none}
header h1{margin:0;font-size:18px;line-height:1.1;color:var(--navy)}header small{color:var(--pri);font-size:12px}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,40,20,.08)}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
input[type=checkbox]{width:22px;min-height:22px;height:22px;padding:0;accent-color:var(--pri);flex:none}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--pri);color:#fff;min-height:46px;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--badbg);color:var(--bad)}.btn.ghost{background:transparent;color:var(--pri)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}.btn.block{width:100%}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fdf9f4}
.item .calc{font-size:12px;color:var(--mute);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.item .calc b{color:var(--ink)}
.item .top{display:flex;gap:8px;align-items:flex-end}.item .top>div:first-child{flex:1}
.x{background:none;border:0;font-size:22px;color:var(--bad);padding:8px;min-height:44px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.sum div:last-child{border:0}.sum .big{font-size:20px;font-weight:700;color:var(--pri)}
.bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .t{font-size:12px;color:var(--mute)}.bar .v{font-size:19px;font-weight:700;color:var(--navy)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--pri);font-weight:700;background:#fbf2e6}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.ord{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(60,40,20,.08);font:inherit;color:inherit}
.ord .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ord .s{font-size:13px;color:var(--mute);margin:4px 0 8px}
.ord .its{margin:6px 0 8px;padding:6px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.ord .its div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.ord .its div span:last-child{white-space:nowrap;color:var(--ink);font-weight:600}
.ord .f{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;min-height:36px;color:var(--ink)}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--r);padding:10px 12px;box-shadow:0 1px 2px rgba(60,40,20,.08)}.kpi small{color:var(--mute);font-size:12px}.kpi div{font-size:18px;font-weight:700;color:var(--navy)}.kpi em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.sheet-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom));z-index:21;display:none;max-width:720px;margin:0 auto}
.sheet h2{margin:2px 4px 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center;color:var(--navy)}
.muted{color:var(--mute);font-size:13px}.neg{color:var(--bad)}.pos{color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}table.t td:last-child,table.t th:last-child{text-align:right}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;z-index:50;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.warnline{font-size:12px;color:var(--warn);margin-top:6px}
.meter{height:10px;background:var(--pri2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pri);border-radius:99px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left}
.rrow:last-child{border-bottom:0}.rrow .n{font-weight:600}.rrow .r{text-align:right;white-space:nowrap}
.pipe{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;padding:4px 0;font-size:14px}.pipe b{text-align:right}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;color:var(--ink);margin:0}
.rcpt{width:100%;border-radius:12px;box-shadow:0 2px 8px rgba(60,40,20,.15);display:block;margin:0 auto 12px;background:#fbf2e8}
</style></head>

<script>/* Pasabuy core logic – mirrors the rules in the Excel workbook */
(function (root) {
  'use strict';
  const SIZES = { 'Small': 0, 'Medium': 100, 'Large': 250, 'Extra Large': 500 };
  const STATUSES = ['Order Confirmed', 'Item Bought', 'Item Delivered', 'Customer Paid'];
  const METHODS = ['Direct Order', 'Equal by Order', 'By Weight', 'By Revenue'];
  const TRIP_METHODS = ['Equal by Order', 'By Weight', 'By Revenue'];
  const CATEGORIES = ['Luggage Fee', 'Excess Baggage', 'Local Transportation', 'Packaging', 'Courier or Delivery', 'Parking or Tolls', 'Other'];
  const DEFAULT_SETTINGS = { serviceRate: 0.2 };

  const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const has = (v) => v !== '' && v !== null && v !== undefined && !(typeof v === 'number' && isNaN(v));

  // Same tiers as the workbook: <=0.5kg free, <=1kg 100, <=2kg 200, <=3kg 300, above = inquire (0 in sheet)
  function weightFeePer(w) {
    if (!has(w)) return 0;
    w = num(w);
    if (w <= 0.5) return 0;
    if (w <= 1) return 100;
    if (w <= 2) return 200;
    if (w <= 3) return 300;
    return 0;
  }

  function calcLine(it, settings) {
    const rate = settings && has(settings.serviceRate) ? settings.serviceRate : 0.2;

  /* ---------- BUYER RECEIPT (image) ---------- */
  let LOGO = null;
  function logoImg() {
    return new Promise((res) => { if (LOGO) return res(LOGO); const i = new Image(); i.onload = () => { LOGO = i; res(i); }; i.onerror = () => res(null); i.src = window.LOGO_URI; });
  }
  // Only items, the price per item (computed or override) and the total – no cost breakdown.
  function receiptData(o, opt) {
    const m = C.metrics(o, S.settings);
    const showPrices = opt.prices && m.lines.length > 0;
    const rows = m.itemList.map((it) => ({ label: qtyf(it.qty) + '×  ' + it.name, amount: showPrices && it.price !== null ? it.price : null }));
    if (showPrices && m.effort + m.other > 0) rows.push({ label: 'Shopping / handling', amount: m.effort + m.other });
    return { buyer: String(o.buyer || '').trim(), date: o.date || todayISO(), rows, showPrices, total: m.final, paid: m.paid, balance: m.balance, showPay: opt.pay };
  }
  async function receiptCanvas(rc) {
    const logo = await logoImg();
    const W = 1080, PAD = 84, LH = 52;
    const FONT = '-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
    const NAVY = '#1b2234', BROWN = '#654023', MUTE = '#7b6a5b', LINE = '#e3d3bf', TAN = '#d5b79b';
    const mc = document.createElement('canvas').getContext('2d');
    const wrap = (ctx, text, maxW) => {
      const out = []; let cur = '';
      String(text).split(/\s+/).forEach((w) => {
        const t = cur ? cur + ' ' + w : w;
        if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; }
      });
      if (cur) out.push(cur); return out;
    };
    function paint(ctx, draw) {
      const T = (txt, x, y, font, color, align) => { if (!draw) return; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.fillText(txt, x, y); };
      const L = (y, color, w) => { if (!draw) return; ctx.strokeStyle = color; ctx.lineWidth = w || 2; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke(); };
      let y = PAD;
      const LS = 250;
      if (draw && logo) ctx.drawImage(logo, (W - LS) / 2, y, LS, LS);
      y += LS + 36;
      y += 32; T('ORDER SUMMARY', W / 2, y, '700 32px ' + FONT, BROWN, 'center'); y += 34;
      if (rc.buyer) { y += 46; T(rc.buyer, W / 2, y, '700 46px ' + FONT, NAVY, 'center'); }
      y += 38; T(fdate(rc.date), W / 2, y, '400 30px ' + FONT, MUTE, 'center'); y += 36;
      L(y, TAN, 3); y += 18;
      ctx.font = '500 40px ' + FONT;
      const priceW = rc.showPrices ? Math.max(...rc.rows.map((r) => (r.amount === null ? 0 : (mc.font = '700 40px ' + FONT, mc.measureText(money(r.amount)).width))), 0) : 0;
      const maxW = W - 2 * PAD - (priceW ? priceW + 36 : 0);
      rc.rows.forEach((r, idx) => {
        mc.font = '500 40px ' + FONT;
        const lines = wrap(mc, r.label, maxW);
        lines.forEach((ln, i) => T(ln, PAD, y + 50 + i * LH, '500 40px ' + FONT, NAVY, 'left'));
        if (r.amount !== null) T(money(r.amount), W - PAD, y + 50, '700 40px ' + FONT, NAVY, 'right');
        y += 24 + lines.length * LH;
        if (idx < rc.rows.length - 1) { L(y, LINE, 2); y += 0; }
      });
      y += 16; L(y, BROWN, 4); y += 28;
      y += 62; T('TOTAL', PAD, y, '700 44px ' + FONT, NAVY, 'left'); T(money(rc.total), W - PAD, y, '800 62px ' + FONT, BROWN, 'right'); y += 24;
      if (rc.showPay) {
        y += 54; T('Amount paid', PAD, y, '400 36px ' + FONT, MUTE, 'left'); T(money(rc.paid), W - PAD, y, '600 36px ' + FONT, NAVY, 'right');
        y += 54; T('Balance due', PAD, y, '600 38px ' + FONT, NAVY, 'left'); T(money(rc.balance), W - PAD, y, '800 42px ' + FONT, rc.balance > 0 ? '#c62828' : '#12805c', 'right'); y += 12;
      }
      y += 70; T('Thank you for shopping with us!', W / 2, y, 'italic 600 38px ' + FONT, BROWN, 'center');
      y += 52; T('WE TRAVEL. YOU SHOP. WE DELIVER.', W / 2, y, '700 26px ' + FONT, MUTE, 'center');
      return y + PAD;
    }
    const H = Math.ceil(paint(mc, false));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fbf2e8'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = TAN; ctx.lineWidth = 6;
    ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(24, 24, W - 48, H - 48, 36) : ctx.rect(24, 24, W - 48, H - 48)); ctx.stroke();
    paint(ctx, true);
    return cv;
  }

    const sm = C.tripSummary(S);
    $('#view').innerHTML = '<button class="btn block" data-act="addTrip" style="margin-bottom:12px">+ New trip</button>' +
      (sm.length ? sm.map((r) => '<button class="ord" data-act="openTrip" data-id="' + h(r.trip.id) + '"><div class="h"><span>' + h(r.trip.name) + '</span><span class="pill ' + (r.trip.status === 'Active' ? 'ok' : '') + '">' + h(r.trip.status) + '</span></div><div class="s">' + h(r.trip.id) + (r.trip.month ? ' · ' + fmonth(r.trip.month) : '') + '</div>' +
        '<div class="row" style="font-size:13px"><div>Orders<br><b>' + r.orders + '</b></div><div>Fee income<br><b>' + money(r.fee) + '</b></div><div>Net profit<br><b class="' + (r.net < 0 ? 'neg' : 'pos') + '">' + money(r.net) + '</b></div></div></button>').join('') : '<div class="empty">No trips yet. Add one to start logging orders.</div>');
  }
  function openTrip(id) {
    const r = C.tripSummary(S).find((x) => x.trip.id === id); if (!r) return;
    const exps = S.expenses.filter((e) => e.tripId === id);
    const row = (a, b) => '<div><span>' + a + '</span><span>' + b + '</span></div>';
    openSheet('<h2>' + h(r.trip.name) + '<button class="btn sm ghost" data-act="closeSheet">Close</button></h2>' +
      '<div class="card sum">' + row('Orders', r.orders) + row('Customer revenue', money(r.revenue)) + row('Fee income', money(r.fee)) + row('Business expenses', money(r.expenses)) + row('Net profit', '<b class="' + (r.net < 0 ? 'neg' : 'pos') + '">' + money(r.net) + '</b>') + row('Profit margin', pct(r.margin)) + row('Avg profit / order', money(r.avg)) + row('Unpaid balances', '<b class="' + (r.outstanding > 0 ? 'neg' : '') + '">' + money(r.outstanding) + '</b>') + '</div>' +
      '<div class="card"><h3>Expenses</h3>' + (exps.length ? '<table class="t">' + exps.map((e) => '<tr><td>' + h(e.category) + '<div class="muted">' + h(e.desc || '') + ' · ' + h(e.method) + '</div></td><td>' + money(e.amount) + ' <button class="x" data-act="delExp" data-id="' + h(e.id) + '" data-trip="' + h(id) + '" style="min-height:0;padding:0 4px;font-size:16px">✕</button></td></tr>').join('') + '</table>' : '<div class="muted">No expenses logged.</div>') +
      '<button class="btn sec block" data-act="addExp" data-trip="' + h(id) + '" style="margin-top:10px">+ Add expense</button></div>' +
      '<div class="row"><button class="btn sec" data-act="editTrip" data-id="' + h(id) + '">Edit trip</button><button class="btn bad" data-act="delTrip" data-id="' + h(id) + '">Delete trip</button></div>');
  }
  function tripForm(t) {
    const n = !t; t = t || { id: '', name: '', dest: '', month: todayISO().slice(0, 7), status: 'Planned', alloc: 'Equal by Order', notes: '' };
    openSheet('<h2>' + (n ? 'New trip' : 'Edit trip') + '<button class="btn sm ghost" data-act="closeSheet">Close</button></h2><div class="card">' +
      '<label>Destination</label><input id="tDest" value="' + h(t.dest) + '" placeholder="e.g. Thailand"><div class="row"><div><label>Travel month</label><input id="tMonth" type="month" value="' + h(t.month) + '"></div><div><label>Status</label><select id="tStatus">' + opts(['Planned', 'Active', 'Completed'], t.status) + '</select></div></div>' +
      '<label>Trip ID</label><input id="tId" value="' + h(t.id) + '" ' + (n ? '' : 'readonly') + ' placeholder="e.g. THA-2026-09"><label>Trip name</label><input id="tName" value="' + h(t.name) + '"><label>Default expense allocation</label><select id="tAlloc">' + opts(C.TRIP_METHODS, t.alloc) + '</select><label>Notes</label><textarea id="tNotes">' + h(t.notes) + '</textarea></div>' +
      '<button class="btn block" data-act="saveTrip" data-new="' + (n ? 1 : 0) + '">Save trip</button>');
  }
  function expForm(tripId) {
    const t = S.trips.find((x) => x.id === tripId);
    const ords = S.orders.filter((o) => o.tripId === tripId);
    openSheet('<h2>Add expense · ' + h(tripId) + '<button class="btn sm ghost" data-act="openTrip" data-id="' + h(tripId) + '">Back</button></h2><div class="card">' +
      '<div class="row"><div><label>Date</label><input id="eDate" type="date" value="' + todayISO() + '"></div><div><label>Amount (₱)</label><input id="eAmt" type="number" inputmode="decimal" step="any"></div></div>' +
      '<label>Category</label><select id="eCat">' + opts(C.CATEGORIES) + '</select><label>Description</label><input id="eDesc">' +
      '<label>Allocation method</label><select id="eMeth">' + opts(C.METHODS, t ? t.alloc : 'Equal by Order') + '</select>' +
      '<div id="eOrdWrap" style="display:none"><label>Order (for Direct Order)</label><select id="eOrd">' + ords.map((o) => '<option value="' + h(o.id) + '">' + h(o.buyer) + ' · ' + h(o.id) + '</option>').join('') + '</select></div>' +
      '<label>Notes</label><input id="eNotes"></div><button class="btn block" data-act="saveExp" data-trip="' + h(tripId) + '">Save expense</button>');
  }

  /* ---------- REPORTS ---------- */
  function renderReports() {
    if (R.trip === null) { const a = S.trips.find((t) => t.status === 'Active'); R.trip = a ? a.id : ''; }
    const p = C.report(S, R.trip);
    const K = (l, v, sub, cls) => '<div class="kpi"><small>' + l + '</small><div class="' + (cls || '') + '">' + v + '</div>' + (sub ? '<em>' + sub + '</em>' : '') + '</div>';
    const maxPipe = Math.max(1, ...Object.values(p.pipeline));
    const rr = (n, sub, r, act) => '<' + (act ? 'button ' + act : 'div') + ' class="rrow"><span><span class="n">' + h(n) + '</span>' + (sub ? '<div class="muted">' + sub + '</div>' : '') + '</span><span class="r">' + r + '</span></' + (act ? 'button' : 'div') + '>';
    $('#view').innerHTML =
      '<select id="rt" style="margin-bottom:12px"><option value="">All trips</option>' + S.trips.map((t) => '<option value="' + h(t.id) + '"' + (t.id === R.trip ? ' selected' : '') + '>' + h(t.name) + '</option>').join('') + '</select>' +
      (p.orders === 0 ? '<div class="empty">No orders for this selection yet.</div>' :
        '<div class="kpis">' + K('Orders', p.orders, p.buyers + ' buyer' + (p.buyers === 1 ? '' : 's')) + K('Customer revenue', money(p.revenue), 'Total billed') + K('Collected', money(p.collected), pct(p.collectedPct) + ' of billed', 'pos') + K('Outstanding', money(p.outstanding), p.owing.length + ' buyer' + (p.owing.length === 1 ? '' : 's') + ' owing', p.outstanding > 0 ? 'neg' : 'pos') +
        K('Fee income', money(p.fee), 'Revenue − item cost') + K('Expenses', money(p.expenses)) + K('Net profit', money(p.net), pct(p.margin) + ' margin', p.net < 0 ? 'neg' : 'pos') + K('Avg profit / order', money(p.net / p.orders)) + '</div>' +
        '<div class="card"><h3>Payments collected</h3><div class="meter"><i style="width:' + (p.collectedPct * 100).toFixed(1) + '%"></i></div><div class="muted" style="margin-top:6px">' + money(p.collected) + ' of ' + money(p.revenue) + '</div></div>' +
        '<div class="card"><h3>Order progress</h3>' + C.STATUSES.map((s) => '<div class="pipe"><span>' + s + '</span><div class="meter"><i style="width:' + (p.pipeline[s] / maxPipe * 100) + '%"></i></div><b>' + p.pipeline[s] + '</b></div>').join('') + '</div>' +
        '<div class="card"><h3>Who still owes</h3>' + (p.owing.length ? p.owing.map((b) => rr(b.name, b.orders + ' order' + (b.orders === 1 ? '' : 's'), '<b class="neg">' + money(b.balance) + '</b>', 'data-act="owe" data-buyer="' + h(b.name) + '"')).join('') : '<div class="muted">Everyone is fully paid. 🎉</div>') + '</div>' +
        '<div class="card"><h3>Top buyers</h3>' + p.topBuyers.slice(0, 5).map((b) => rr(b.name, b.orders + ' order' + (b.orders === 1 ? '' : 's') + ' · profit ' + money(b.net), '<b>' + money(b.revenue) + '</b>')).join('') + '</div>' +
        '<div class="card"><h3>Most requested items</h3>' + p.topItems.slice(0, 8).map((i) => rr(i.name, i.priced ? 'Billed ' + money(i.revenue) : '', '<b>' + qtyf(i.qty) + ' pcs</b>')).join('') + '</div>' +
        (p.expCats.length ? '<div class="card"><h3>Expenses by category</h3>' + p.expCats.map((e) => rr(e.name, '', '<b>' + money(e.amount) + '</b>')).join('') + '</div>' : '') +
        '<button class="btn sec block" data-act="xlsx">Export all data to Excel</button>');
  }

  /* ---------- MORE ---------- */
  function renderMore() {
    const lb = +localStorage.getItem(BKEY);
    $('#view').innerHTML =
      '<div class="card"><h3>Export &amp; backup</h3><p class="muted" style="margin-top:0">Everything is stored on this phone. The Excel export has your Transaction Log, one row per item (Order Items), a Buyer Summary and your trip sheets.</p>' +
      '<button class="btn block" data-act="xlsx">Export to Excel (.xlsx)</button><div class="row" style="margin-top:8px"><button class="btn sec" data-act="backup">Backup (.json)</button><button class="btn sec" data-act="restore">Restore / import</button></div>' +
      '<input type="file" id="file" accept=".json,application/json" style="display:none"><div class="muted" style="margin-top:8px">Last backup/export: ' + (lb ? new Date(lb).toLocaleString() : 'never') + '</div></div>' +
      '<div class="card"><h3>Pricing setting</h3><label>Service fee (% of item cost)</label><input id="rate" type="number" inputmode="decimal" step="any" value="' + (S.settings.serviceRate * 100) + '"></div>' +
      '<div class="card"><h3>Fee guide</h3><table class="t"><tr><th>Packed size</th><th>Fee / item</th></tr><tr><td>Small ≤ 20×15×10 cm</td><td>Free</td></tr><tr><td>Medium ≤ 30×20×15 cm</td><td>₱100</td></tr><tr><td>Large ≤ 45×35×20 cm</td><td>₱250</td></tr><tr><td>Extra Large</td><td>₱500</td></tr></table>' +
      '<table class="t" style="margin-top:10px"><tr><th>Weight / item</th><th>Fee / item</th></tr><tr><td>0–500 g</td><td>Free</td></tr><tr><td>500 g–1 kg</td><td>₱100</td></tr><tr><td>1–2 kg</td><td>₱200</td></tr><tr><td>2–3 kg</td><td>₱300</td></tr><tr><td>3 kg and above</td><td>Inquire</td></tr></table>' +
      '<p class="muted">Total = item cost + service fee + size fee + weight fee, plus any shopping/effort and other charge. Final prices are confirmed after purchase.</p></div>' +
      '<div class="card"><h3>Danger zone</h3><button class="btn bad block" data-act="wipe">Delete all data on this device</button></div>' +
      '<div class="muted" style="text-align:center">EC Pasabuy PH · works offline once installed</div>';
  }
  function stamp() { localStorage.setItem(BKEY, Date.now()); }
  function doImport(data, mode) {
    const merge = (cur, inc) => { const m = new Map(cur.map((x) => [x.id, x])); inc.forEach((x) => m.set(x.id, x)); return [...m.values()]; };
    if (mode === 'replace') S = { settings: Object.assign({}, C.DEFAULT_SETTINGS, data.settings), trips: data.trips || [], expenses: data.expenses || [], orders: data.orders || [] };
    else { S.trips = merge(S.trips, data.trips || []); S.expenses = merge(S.expenses, data.expenses || []); S.orders = merge(S.orders, data.orders || []); }
    save(); closeSheet(); toast('Imported ' + (data.orders || []).length + ' orders.'); go('orders');
  }

  /* ---------- events ---------- */
  document.addEventListener('input', (e) => {
    const t = e.target, f = t.dataset && t.dataset.f;
    if (f && tab === 'order') {
      const it = t.closest('.item');
      if (it) D.items[+it.dataset.i][f] = t.value; else D[f] = t.value;
      saveDraft(); recalc();
    }
    if (t.id === 'q') { F.q = t.value; const p = t.selectionStart; renderOrders(); const q = $('#q'); q.focus(); q.setSelectionRange(p, p); }
    if (t.id === 'oNotes') { const o = S.orders.find((x) => x.id === t.dataset.id); o.notes = t.value; touch(o); }
    if (t.id === 'rate') { const v = parseFloat(t.value); if (isFinite(v) && v >= 0) { S.settings.serviceRate = v / 100; save(); } }
    if (t.id === 'tId') t.dataset.touched = 1;
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.f === 'buyer' && !D.contact) {
      const prev = [...S.orders].reverse().find((o) => o.buyer.toLowerCase() === t.value.trim().toLowerCase() && o.contact);
      if (prev) { D.contact = prev.contact; const c = $('[data-f=contact]'); if (c) c.value = prev.contact; saveDraft(); }
    }
    if (t.dataset && t.dataset.f === 'tripId') { saveDraft(); }
    if (t.id === 'ft') { F.trip = t.value; renderOrders(); }
    if (t.id === 'rt') { R.trip = t.value; renderReports(); }
    if (t.id === 'rcPrices') { RC.prices = t.checked; refreshReceipt(); }
    if (t.id === 'rcPay') { RC.pay = t.checked; refreshReceipt(); }
    if (t.id === 'oStatus') { const o = S.orders.find((x) => x.id === t.dataset.id); o.status = t.value; touch(o); toast('Status updated.'); }
    if (t.id === 'eMeth') $('#eOrdWrap').style.display = t.value === 'Direct Order' ? 'block' : 'none';
    if (t.id === 'tDest' || t.id === 'tMonth') { const idEl = $('#tId'); if (idEl && !idEl.readOnly && !idEl.dataset.touched) { const d = $('#tDest').value.trim(), m = $('#tMonth').value; if (d && m) { idEl.value = d.slice(0, 3).toUpperCase() + '-' + m; $('#tName').value = d + ' – ' + fmonth(m); } } }
    if (t.id === 'file' && t.files[0]) {
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(rd.result); if (!Array.isArray(d.orders)) throw 0;
          openSheet('<h2>Import ' + d.orders.length + ' orders<button class="btn sm ghost" data-act="closeSheet">Cancel</button></h2><div class="card"><p>Found ' + (d.trips || []).length + ' trips, ' + (d.expenses || []).length + ' expenses and ' + d.orders.length + ' orders.</p><button class="btn block" id="impM">Merge with current data</button><button class="btn bad block" id="impR" style="margin-top:8px">Replace everything</button></div>');
          $('#impM').onclick = () => doImport(d, 'merge'); $('#impR').onclick = () => doImport(d, 'replace');
        } catch (err) { toast('That file is not a Pasabuy backup.'); }
      };
      rd.readAsText(t.files[0]); t.value = '';
    }
  });
  document.addEventListener('click', async (e) => {
    const nb = e.target.closest('nav button'); if (nb) return go(nb.dataset.tab);
    const chip = e.target.closest('[data-chip]'); if (chip) { F.chip = chip.dataset.chip; return renderOrders(); }
    if (e.target.id === 'sbg') return closeSheet();
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act, id = b.dataset.id;
    if (a === 'goMore') { e.preventDefault(); return go('more'); }
    if (a === 'closeSheet') return closeSheet();
    if (a === 'addItem') { D.items.push(blankItem()); saveDraft(); renderOrder(); const els = document.querySelectorAll('.item'); els[els.length - 1].scrollIntoView({ block: 'center' }); return; }
    if (a === 'rmItem') { const i = +b.closest('.item').dataset.i; D.items.splice(i, 1); if (!D.items.length) D.items.push(blankItem()); saveDraft(); return renderOrder(); }
    if (a === 'saveOrder') return saveOrder();
    if (a === 'cancelEdit') { D = null; D = newDraft(); saveDraft(); return renderOrder(); }
    if (a === 'openOrder') return openOrder(id);
    if (a === 'addPay') { const v = parseFloat($('#oPay').value); if (!(v > 0)) return toast('Enter an amount.'); const o = S.orders.find((x) => x.id === id); o.paid = C.num(o.paid) + v; touch(o); toast('Payment recorded.'); renderOrders(); return openOrder(id); }
    if (a === 'payFull') { const o = S.orders.find((x) => x.id === id); o.paid = C.metrics(o, S.settings).final; touch(o); toast('Marked fully paid.'); renderOrders(); return openOrder(id); }
    if (a === 'copyMsg') { const txt = buyerMessage(id); try { await navigator.clipboard.writeText(txt); toast('Message copied.'); } catch (err) { prompt('Copy this message:', txt); } return; }
    if (a === 'editOrder') { const o = S.orders.find((x) => x.id === id); D = { editId: o.id, tripId: o.tripId, buyer: o.buyer, contact: o.contact || '', date: o.date, items: o.items.map((i) => Object.assign({}, i)), effort: o.effort, other: o.other, paid: o.paid, status: o.status, notes: o.notes || '' }; saveDraft(); closeSheet(); return go('order'); }
    if (a === 'delOrder') { if (confirm('Delete this order permanently?')) { S.orders = S.orders.filter((x) => x.id !== id); save(); closeSheet(); toast('Order deleted.'); renderOrders(); } return; }
    if (a === 'orderReceipt') { RC.src = id; RC.back = id; RC.prices = true; RC.pay = false; return showReceipt(); }
    if (a === 'draftReceipt') { if (!C.metrics(D, S.settings).lines.length) return toast('Add at least one item with a name and price.'); RC.src = 'draft'; RC.back = null; RC.prices = true; RC.pay = false; return showReceipt(); }
    if (a === 'rcBack') return openOrder(RC.back);
    if (a === 'rcShare' || a === 'rcDownload') { const blob = await toBlob(RC.canvas); await saveBlob(blob, rcName(), a === 'rcDownload'); return; }
    if (a === 'owe') { F.q = b.dataset.buyer; F.chip = 'Owing'; F.trip = R.trip || ''; return go('orders'); }
    if (a === 'addTrip') return tripForm();
    if (a === 'editTrip') return tripForm(S.trips.find((t) => t.id === id));
    if (a === 'openTrip') return openTrip(id);
    if (a === 'saveTrip') {
      const t = { id: $('#tId').value.trim(), name: $('#tName').value.trim(), dest: $('#tDest').value.trim(), month: $('#tMonth').value, status: $('#tStatus').value, alloc: $('#tAlloc').value, notes: $('#tNotes').value.trim() };
      if (!t.id || !t.name) return toast('Trip ID and name are required.');
      if (b.dataset.new === '1') { if (S.trips.some((x) => x.id === t.id)) return toast('That Trip ID already exists.'); S.trips.push(t); } else Object.assign(S.trips.find((x) => x.id === t.id), t);
      save(); closeSheet(); toast('Trip saved.'); return renderTrips();
    }
    if (a === 'delTrip') { if (S.orders.some((o) => o.tripId === id) || S.expenses.some((x) => x.tripId === id)) return toast('Trip has orders or expenses – cannot delete.'); if (confirm('Delete this trip?')) { S.trips = S.trips.filter((t) => t.id !== id); save(); closeSheet(); renderTrips(); } return; }
    if (a === 'addExp') return expForm(b.dataset.trip);
    if (a === 'saveExp') {
      const amt = parseFloat($('#eAmt').value); if (!(amt > 0)) return toast('Enter the amount.');
      const meth = $('#eMeth').value; if (meth === 'Direct Order' && !$('#eOrd').value) return toast('Choose the order.');
      let n = S.expenses.length + 1, eid; do { eid = 'EXP-' + String(n++).padStart(3, '0'); } while (S.expenses.some((x) => x.id === eid));
      S.expenses.push({ id: eid, date: $('#eDate').value, tripId: b.dataset.trip, category: $('#eCat').value, desc: $('#eDesc').value.trim(), amount: amt, method: meth, orderId: meth === 'Direct Order' ? $('#eOrd').value : '', notes: $('#eNotes').value.trim() });
      save(); toast('Expense added.'); renderTrips(); return openTrip(b.dataset.trip);
    }
    if (a === 'delExp') { if (confirm('Delete this expense?')) { S.expenses = S.expenses.filter((x) => x.id !== id); save(); renderTrips(); openTrip(b.dataset.trip); } return; }
    if (a === 'xlsx') { const blob = C.buildXlsx(C.exportSheets(S)); if (await saveBlob(blob, 'Pasabuy-' + todayISO() + '.xlsx')) { stamp(); if (tab === 'more') renderMore(); } return; }
    if (a === 'backup') { const blob = new Blob([JSON.stringify({ app: 'pasabuy', version: 1, exported: nowISO(), settings: S.settings, trips: S.trips, expenses: S.expenses, orders: S.orders }, null, 1)], { type: 'application/json' }); if (await saveBlob(blob, 'pasabuy-backup-' + todayISO() + '.json')) { stamp(); renderMore(); } return; }
    if (a === 'restore') return $('#file').click();
    if (a === 'wipe') { if (confirm('Delete ALL trips, orders and expenses on this device?') && confirm('This cannot be undone. Really delete?')) { S = { settings: Object.assign({}, C.DEFAULT_SETTINGS), trips: [], expenses: [], orders: [] }; save(); D = null; D = newDraft(); saveDraft(); toast('All data deleted.'); renderMore(); } return; }
  });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  go('order');
})();
</script>
</body></html>
